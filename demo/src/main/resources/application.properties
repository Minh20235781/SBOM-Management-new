spring.application.name=demo

# H2 In-Memory Database (Default for quick start without MySQL)
spring.datasource.url=jdbc:h2:mem:sbom_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL configuration (Uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/sbom_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=31032004
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable AI module
ai.enabled=true

# Google Gemini Configuration (FREE TIER)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-2.5-flash
ai.gemini.temperature=0.7
ai.gemini.max-tokens=4096

# provider
ai.provider=gemini

# File Upload
file.upload.max-size=10MB
file.upload.allowed-extensions=json,txt

# Zenodo-trained RandomForest (13 features) via rf_server.py port 8002
ai.rf-new.service-url=http://localhost:8002
ai.rf-new.connect-timeout-ms=2000
ai.rf-new.timeout-seconds=120

# GNN Explainability
gnn.explainability.model=gat
gnn.explainability.model-path=../gnn-training/exports/gat_model.pt
gnn.explainability.gcn-model-path=../gnn-training/exports/gcn_model.pt

# Trivy cache
trivy.cache-dir=./trivy-cache

# Cleanup: removes old scan_<UUID> dirs; keeps db/ and java-db/
trivy.cache.cleanup.enabled=true
trivy.cache.cleanup.retention-hours=24
trivy.cache.cleanup.cron=0 0 0/12 * * *
